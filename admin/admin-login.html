<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | SG MAKEOVERS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 89, 165, .20), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(145, 74, 255, .18), transparent 32%),
                #fff9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            color: #302330;
        }

        .login-wrapper {
            width: min(1080px, 100%);
            min-height: 650px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #fff;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(100, 38, 88, .16);
        }

        .brand-panel {
            position: relative;
            overflow: hidden;
            padding: 58px;
            color: white;
            background: linear-gradient(145deg, #c7257e, #a83bb9 55%, #8e4df1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 360px;
            height: 360px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 50%;
            top: -150px;
            right: -120px;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 240px;
            height: 240px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 50%;
            bottom: -130px;
            left: -80px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 18px;
            margin-bottom: 35px;
        }

        .brand-name {
            position: relative;
            z-index: 2;
            letter-spacing: 6px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .brand-panel h1 {
            position: relative;
            z-index: 2;
            font-family: "Playfair Display", serif;
            font-size: clamp(48px, 5vw, 70px);
            line-height: .98;
            max-width: 430px;
        }

        .brand-panel h1 em {
            font-weight: 500;
        }

        .brand-panel p {
            position: relative;
            z-index: 2;
            margin-top: 28px;
            max-width: 430px;
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255,255,255,.9);
        }

        .form-panel {
            padding: 58px 64px;
            display: flex;
            align-items: center;
        }

        .form-inner {
            width: 100%;
            max-width: 470px;
            margin: auto;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 14px;
            border-radius: 30px;
            background: #fff0f7;
            color: #d42b78;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .form-inner h2 {
            font-family: "Playfair Display", serif;
            font-size: 45px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8a7b89;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .error-box,
        .success-box {
            display: none;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error-box {
            color: #c92e4e;
            background: #fff0f3;
            border: 1px solid #ffc5d0;
        }

        .success-box {
            color: #18794e;
            background: #effcf5;
            border: 1px solid #bcefd4;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #b5a8b4;
        }

        .input-wrap input {
            width: 100%;
            height: 54px;
            border: 1px solid #eadce8;
            border-radius: 16px;
            padding: 0 48px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            color: #302330;
            background: #fff;
            transition: .2s;
        }

        .input-wrap input:focus {
            border-color: #d8398c;
            box-shadow: 0 0 0 4px rgba(216,57,140,.08);
        }

        .toggle-password {
            position: absolute;
            right: 17px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
            cursor: pointer;
            color: #a99ba8;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            height: 56px;
            border: 0;
            border-radius: 17px;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, #df358b, #8e4df1);
            box-shadow: 0 14px 28px rgba(195, 48, 137, .23);
            transition: .2s;
            margin-top: 6px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #8b7d8a;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #d42b78;
        }

        @media (max-width: 850px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                min-height: 300px;
                padding: 40px;
            }

            .brand-panel h1 {
                font-size: 48px;
            }

            .form-panel {
                padding: 45px 30px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .login-wrapper {
                border-radius: 22px;
            }

            .brand-panel {
                min-height: 260px;
                padding: 32px;
            }

            .brand-panel h1 {
                font-size: 40px;
            }

            .form-panel {
                padding: 35px 22px;
            }

            .form-inner h2 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <section class="brand-panel">

        <div class="logo-box"></div>

        <div class="brand-name">
            SG MAKEOVERS
        </div>

        <h1>
            Beauty,<br>
            <em>beautifully</em><br>
            managed.
        </h1>

        <p>
            Welcome to the SG MAKEOVERS administration portal.
            Manage appointments, customers, services, staff and
            payments from one elegant workspace.
        </p>

    </section>

    <section class="form-panel">

        <div class="form-inner">

            <div class="eyebrow">
                <i class="fa-solid fa-lock"></i>
                SECURE ADMIN ACCESS
            </div>

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to access your SG MAKEOVERS management dashboard.
            </p>

            <div id="errorBox" class="error-box"></div>

            <div id="successBox" class="success-box"></div>

            <form id="adminLoginForm">

                <div class="field">
                    <label for="email">Admin Email</label>

                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            value="admin@sgmakeovers.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Sign In to Dashboard
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                Back to SG MAKEOVERS
            </a>

        </div>

    </section>

</div>

<script>

const loginForm = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");

const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");

function showError(message) {
    successBox.style.display = "none";
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function showSuccess(message) {
    errorBox.style.display = "none";
    successBox.textContent = message;
    successBox.style.display = "block";
}

function hideMessages() {
    errorBox.style.display = "none";
    successBox.style.display = "none";
}

document.getElementById("togglePassword").addEventListener("click", function () {

    const icon = this.querySelector("i");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.className = "fa-regular fa-eye-slash";
    } else {
        passwordInput.type = "password";
        icon.className = "fa-regular fa-eye";
    }

});

loginForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    hideMessages();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showError("Please enter your admin email and password.");
        return;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

    try {

        /*
         * STEP 1:
         * Authenticate through Supabase Auth.
         */
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw new Error(error.message);
        }

        if (!data || !data.user) {
            throw new Error("Login succeeded but no user session was returned.");
        }

        /*
         * STEP 2:
         * Verify admin through SECURITY DEFINER RPC.
         *
         * This avoids the admins-table RLS problem.
         */
        const { data: adminCheck, error: adminError } =
            await supabaseClient.rpc("is_admin");

        if (adminError) {
            console.error("Admin RPC error:", adminError);
            throw new Error(
                "Admin verification failed. Please check the is_admin function."
            );
        }

        if (adminCheck !== true) {

            await supabaseClient.auth.signOut();

            throw new Error(
                "This account is authenticated but is not registered as an active admin."
            );
        }

        /*
         * STEP 3:
         * Save a small local flag for the existing admin pages.
         */
        localStorage.setItem(
            "sgMakeoversAdminLoggedIn",
            "true"
        );

        localStorage.setItem(
            "sgMakeoversAdminEmail",
            data.user.email || email
        );

        localStorage.setItem(
            "sgMakeoversAdminUserId",
            data.user.id
        );

        showSuccess("Login successful. Opening dashboard...");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 500);

    } catch (error) {

        console.error("Admin login error:", error);

        showError(
            error.message ||
            "Unable to sign in. Please try again."
        );

        loginBtn.disabled = false;

        loginBtn.innerHTML =
            'Sign In to Dashboard <i class="fa-solid fa-arrow-right"></i>';
    }

});

</script>

</body>
</html>
